<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C Programming Curriculum — SkillExa</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: rgba(18, 26, 43, 0.75);
            --border-glow: rgba(99, 102, 241, 0.25);
            --primary: #6366f1;
            --cyan-neon: #06b6d4;
            --emerald-neon: #10b981;
            --amber-neon: #f59e0b;
            --rose-neon: #f43f5e;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            background-image: radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.25rem 3rem; background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-glow);
            position: sticky; top: 0; z-index: 100;
        }

        .brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
        .brand-icon {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, var(--cyan-neon), #0284c7);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; color: #fff; box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
        }
        .brand-text {
            font-size: 1.6rem; font-weight: 800;
            background: linear-gradient(to right, #ffffff, #67e8f9);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .nav-links { display: flex; align-items: center; gap: 2rem; list-style: none; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 0.95rem; }
        .nav-links a:hover, .nav-links a.active { color: #fff; }

        .container { max-width: 1250px; margin: 3rem auto; padding: 0 2rem; }

        .header-box { text-align: center; margin-bottom: 3.5rem; }
        .header-box h1 { font-size: 2.8rem; font-weight: 800; margin-bottom: 0.75rem; }
        .header-box p { color: var(--text-muted); font-size: 1.1rem; max-width: 760px; margin: 0 auto; }

        .module-section { margin-bottom: 3.5rem; }
        .module-header {
            font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 1.25rem;
            display: flex; align-items: center; gap: 0.75rem; border-bottom: 1px solid var(--border-glow); padding-bottom: 0.5rem;
        }

        .topics-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem;
        }

        .topic-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 16px; padding: 1.5rem;
            backdrop-filter: blur(12px);
            display: flex; flex-direction: column; justify-content: space-between;
            gap: 1rem; transition: all 0.25s ease; position: relative; text-decoration: none; color: inherit;
        }

        .topic-card:not(.locked):hover {
            border-color: var(--cyan-neon); transform: translateY(-4px); box-shadow: 0 8px 25px rgba(6, 182, 212, 0.25);
        }

        .topic-card.locked { opacity: 0.6; cursor: not-allowed; }

        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .topic-num {
            font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; font-weight: 700;
            color: var(--cyan-neon); background: rgba(6, 182, 212, 0.15); padding: 0.2rem 0.6rem; border-radius: 6px;
        }

        .status-badge {
            font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 999px;
        }
        .badge-completed { background: rgba(16, 185, 129, 0.2); color: var(--emerald-neon); }
        .badge-progress { background: rgba(6, 182, 212, 0.2); color: var(--cyan-neon); }
        .badge-locked { background: rgba(255, 255, 255, 0.08); color: var(--text-muted); }

        .topic-title { font-size: 1.1rem; font-weight: 700; color: #fff; line-height: 1.4; }

        .progress-bar-bg {
            height: 6px; width: 100%; background: rgba(255, 255, 255, 0.1); border-radius: 999px; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; background: linear-gradient(to right, var(--cyan-neon), var(--emerald-neon)); border-radius: 999px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="/" class="brand">
            <div class="brand-icon"><i class="fa-solid fa-c"></i></div>
            <span class="brand-text">SkillExa C Track</span>
        </a>

        <ul class="nav-links">
            <li><a href="/"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a href="/languages"><i class="fa-solid fa-laptop-code"></i> Languages</a></li>
            <li><a href="/dsa"><i class="fa-solid fa-diagram-project"></i> DSA Practice</a></li>
            <li><a href="/mock-interview"><i class="fa-solid fa-comments"></i> AI Mock Interview</a></li>
            <li><a href="/resume-builder"><i class="fa-solid fa-file-invoice"></i> Resume Builder</a></li>
        </ul>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <div class="header-box">
            <h1>C Systems Programming Curriculum</h1>
            <p>Master native memory allocation, pointers, struct data models, file I/O, and low-level C programming across 48 interactive topics in 10 modules.</p>
        </div>

        <div id="modulesContainer">
            <!-- Populated via JavaScript -->
        </div>
    </div>

    <script>
        async function loadCTopics() {
            try {
                let res = await fetch('/c/api/topics');
                if (!res.ok) {
                    res = await fetch('/api/c/topics');
                }
                const data = await res.json();
                if (data.success) {
                    renderModules(data.modules);
                }
            } catch (err) {
                console.error("Failed to load C topics catalog:", err);
            }
        }

        function renderModules(modules) {
            const container = document.getElementById('modulesContainer');
            container.innerHTML = modules.map(m => `
                <div class="module-section">
                    <div class="module-header">
                        <i class="fa-solid fa-folder-open" style="color: var(--cyan-neon);"></i>
                        ${m.module} (${m.topics.length} Topics)
                    </div>
                    <div class="topics-grid">
                        ${m.topics.map(t => {
                            const isLocked = t.status === 'LOCKED';
                            const link = isLocked ? '#' : `/c/topic/${t.id}`;
                            const statusClass = t.status === 'COMPLETED' ? 'badge-completed' : (isLocked ? 'badge-locked' : 'badge-progress');
                            return `
                                <a href="${link}" class="topic-card ${isLocked ? 'locked' : ''}">
                                    <div>
                                        <div class="card-top">
                                            <span class="topic-num">Topic ${t.id}</span>
                                            <span class="status-badge ${statusClass}">${t.status}</span>
                                        </div>
                                        <div class="topic-title" style="margin-top: 0.75rem;">${t.title}</div>
                                    </div>
                                    <div>
                                        <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.4rem; display: flex; justify-content: space-between;">
                                            <span>Completeness</span>
                                            <span>${t.completeness}%</span>
                                        </div>
                                        <div class="progress-bar-bg">
                                            <div class="progress-bar-fill" style="width: ${t.completeness}%;"></div>
                                        </div>
                                    </div>
                                </a>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', loadCTopics);
    </script>
</body>
</html>
