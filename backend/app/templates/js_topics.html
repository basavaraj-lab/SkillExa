<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Curriculum — SkillExa</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f131a;
            --bg-card: rgba(24, 30, 42, 0.78);
            --border-glow: rgba(247, 223, 30, 0.3);
            --primary: #f7df1e;
            --primary-glow: #eab308;
            --cyan-neon: #38bdf8;
            --emerald-neon: #10b981;
            --amber-neon: #fbbf24;
            --rose-neon: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            background-image: radial-gradient(circle at 10% 20%, rgba(247, 223, 30, 0.12) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(234, 179, 8, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.25rem 3rem; background: rgba(15, 19, 26, 0.88);
            backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-glow);
            position: sticky; top: 0; z-index: 100;
        }

        .brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
        .brand-icon {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, #f7df1e, #d97706);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; color: #111; box-shadow: 0 0 20px rgba(247, 223, 30, 0.4);
            font-weight: 800;
        }
        .brand-text {
            font-size: 1.6rem; font-weight: 800;
            background: linear-gradient(to right, #ffffff, #fde047);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .nav-links { display: flex; align-items: center; gap: 2rem; list-style: none; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 0.95rem; }
        .nav-links a:hover, .nav-links a.active { color: #fff; }

        .container { max-width: 1250px; margin: 3rem auto; padding: 0 2rem; }

        .header-box { text-align: center; margin-bottom: 3.5rem; }
        .header-box h1 { font-size: 2.8rem; font-weight: 800; margin-bottom: 0.75rem; }
        .header-box p { color: var(--text-muted); font-size: 1.1rem; max-width: 820px; margin: 0 auto; }

        .search-filter-box {
            display: flex; gap: 1rem; margin-bottom: 2.5rem; max-width: 700px; margin-left: auto; margin-right: auto;
        }
        .search-input {
            flex: 1; padding: 0.85rem 1.25rem; border-radius: 12px; border: 1px solid var(--border-glow);
            background: rgba(15, 23, 42, 0.6); color: #fff; font-family: inherit; font-size: 1rem; outline: none;
        }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(247, 223, 30, 0.25); }

        .module-section { margin-bottom: 3.5rem; }
        .module-header {
            font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 1.25rem;
            display: flex; align-items: center; gap: 0.75rem; border-bottom: 1px solid var(--border-glow); padding-bottom: 0.5rem;
        }

        .topics-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem;
        }

        .topic-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 16px; padding: 1.5rem;
            backdrop-filter: blur(12px);
            display: flex; flex-direction: column; justify-content: space-between;
            gap: 1rem; transition: all 0.25s ease; position: relative; text-decoration: none; color: inherit;
        }

        .topic-card:not(.locked):hover {
            border-color: var(--primary); transform: translateY(-4px); box-shadow: 0 8px 25px rgba(247, 223, 30, 0.25);
        }

        .topic-card.locked { opacity: 0.55; cursor: not-allowed; }

        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .topic-num {
            font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; font-weight: 700;
            color: #fde047; background: rgba(247, 223, 30, 0.15); padding: 0.2rem 0.6rem; border-radius: 6px;
        }

        .status-badge {
            font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 999px;
        }
        .badge-completed { background: rgba(16, 185, 129, 0.2); color: var(--emerald-neon); }
        .badge-progress { background: rgba(247, 223, 30, 0.2); color: #fde047; }
        .badge-locked { background: rgba(255, 255, 255, 0.08); color: var(--text-muted); }

        .topic-title { font-size: 1.1rem; font-weight: 700; color: #fff; line-height: 1.4; }

        .progress-bar-bg {
            height: 6px; width: 100%; background: rgba(255, 255, 255, 0.1); border-radius: 999px; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; background: linear-gradient(to right, var(--primary), var(--amber-neon)); border-radius: 999px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="/" class="brand">
            <div class="brand-icon"><i class="fa-brands fa-js"></i></div>
            <span class="brand-text">SkillExa JS Track</span>
        </a>

        <ul class="nav-links">
            <li><a href="/"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a href="/languages"><i class="fa-solid fa-laptop-code"></i> Languages</a></li>
            <li><a href="/dsa"><i class="fa-solid fa-diagram-project"></i> DSA Practice</a></li>
            <li><a href="/mock-interview"><i class="fa-solid fa-comments"></i> AI Mock Interview</a></li>
            <li><a href="/resume-builder"><i class="fa-solid fa-file-invoice"></i> Resume Builder</a></li>
        </ul>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <div class="header-box">
            <h1>JavaScript Learning Curriculum</h1>
            <p>Master ES6+, DOM Manipulation, Async/Await, OOP, Data Structures, Event Loop, Closures, JSON, Regex, and Testing across 101 topics in 14 modules.</p>
        </div>

        <div class="search-filter-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Search topics (e.g. Closures, DOM, Async, Array)..." onkeyup="filterTopics()">
        </div>

        <div id="modulesContainer">
            <!-- Populated via JavaScript -->
        </div>
    </div>

    <script>
        let allModules = [];

        async function loadJSTopics() {
            try {
                let res = await fetch('/js/api/topics');
                if (!res.ok) {
                    res = await fetch('/api/js/topics');
                }
                const data = await res.json();
                if (data.success) {
                    allModules = data.modules;
                    renderModules(allModules);
                }
            } catch (err) {
                console.error("Failed to load JavaScript topics catalog:", err);
            }
        }

        function filterTopics() {
            const query = document.getElementById('searchInput').value.toLowerCase().strip ? document.getElementById('searchInput').value.toLowerCase().trim() : '';
            if (!query) {
                renderModules(allModules);
                return;
            }
            const filtered = allModules.map(m => {
                const matching = m.topics.filter(t => t.title.toLowerCase().includes(query) || m.module.toLowerCase().includes(query));
                return { module: m.module, topics: matching };
            }).filter(m => m.topics.length > 0);

            renderModules(filtered);
        }

        function renderModules(modules) {
            const container = document.getElementById('modulesContainer');
            if (!modules || modules.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 3rem; color: var(--text-muted);">No matching JavaScript topics found.</div>`;
                return;
            }
            container.innerHTML = modules.map(m => `
                <div class="module-section">
                    <div class="module-header">
                        <i class="fa-brands fa-js" style="color: var(--primary);"></i>
                        ${m.module} (${m.topics.length} Topics)
                    </div>
                    <div class="topics-grid">
                        ${m.topics.map(t => {
                            const isLocked = t.status === 'LOCKED';
                            const link = isLocked ? '#' : `/js/topic/${t.id}`;
                            const statusClass = t.status === 'COMPLETED' ? 'badge-completed' : (isLocked ? 'badge-locked' : 'badge-progress');
                            return `
                                <a href="${link}" class="topic-card ${isLocked ? 'locked' : ''}">
                                    <div>
                                        <div class="card-top">
                                            <span class="topic-num">Topic ${t.id}</span>
                                            <span class="status-badge ${statusClass}">${t.status}</span>
                                        </div>
                                        <div class="topic-title" style="margin-top: 0.75rem;">${t.title}</div>
                                    </div>
                                    <div>
                                        <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.4rem; display: flex; justify-content: space-between;">
                                            <span>Completeness</span>
                                            <span>${t.completeness}%</span>
                                        </div>
                                        <div class="progress-bar-bg">
                                            <div class="progress-bar-fill" style="width: ${t.completeness}%;"></div>
                                        </div>
                                    </div>
                                </a>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', loadJSTopics);
    </script>
</body>
</html>
